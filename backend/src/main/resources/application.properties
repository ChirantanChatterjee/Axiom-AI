# ======================================
# APPLICATION
# ======================================

spring.application.name=aif-platform

# ======================================
# SERVER
# ======================================

server.port=${PORT:8080}

# ======================================
# OPENAI
# ======================================

openai.api.key=${OPENAI_API_KEY:}

# ======================================
# SUPABASE / SOCIAL AUTH
# ======================================

aif.supabase.url=${SUPABASE_URL:}
aif.supabase.anon-key=${SUPABASE_ANON_KEY:}
aif.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
aif.supabase.storage.bucket=${AIF_SUPABASE_STORAGE_BUCKET:}
aif.supabase.storage.prefix=${AIF_SUPABASE_STORAGE_PREFIX:generated-frameworks/}
aif.admin.emails=${AIF_ADMIN_EMAILS:}

# ======================================
# POSTGRESQL
# ======================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aif_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chirantanchatterjee}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ======================================
# JPA
# ======================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# ======================================
# FLYWAY
# ======================================

spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# ======================================
# JACKSON
# ======================================

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# ======================================
# AIF WORKSPACE
# ======================================

aif.workspace.root=workspace
aif.generated-tests.timeout-minutes=${AIF_GENERATED_TEST_TIMEOUT_MINUTES:6}
aif.generated-tests.execution-mode=${AIF_GENERATED_TEST_EXECUTION_MODE:worker}
aif.generated-tests.maven-offline=${AIF_GENERATED_TEST_MAVEN_OFFLINE:true}
aif.generated-tests.maven-opts=${AIF_GENERATED_TEST_MAVEN_OPTS:-Xmx192m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError -Djava.awt.headless=true}
aif.worker.enabled=${AIF_WORKER_ENABLED:false}
aif.worker.poll-delay-ms=${AIF_WORKER_POLL_DELAY_MS:5000}
aif.worker.recover-stale-running-jobs=${AIF_WORKER_RECOVER_STALE_RUNNING_JOBS:true}
aif.worker.stale-running-job-seconds=${AIF_WORKER_STALE_RUNNING_JOB_SECONDS:30}
aif.cors.allowed-origins=${AIF_CORS_ALLOWED_ORIGINS:https://aif-pi.vercel.app,http://localhost:5173,http://localhost:3000,http://localhost:8080}

# ======================================
# LOGGING
# ======================================

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=${AIF_HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.com.axiomai=${AIF_APP_LOG_LEVEL:INFO}

#========================================
# REPORTS
#========================================
aif.public-base-url=${AIF_PUBLIC_BASE_URL:${RAILWAY_PUBLIC_DOMAIN:${RENDER_EXTERNAL_URL:http://localhost:8080}}}
spring.web.resources.static-locations=file:reports/
