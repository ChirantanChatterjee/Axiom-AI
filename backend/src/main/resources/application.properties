# ======================================
# APPLICATION
# ======================================

spring.application.name=aif-platform

# ======================================
# SERVER
# ======================================

server.port=${PORT:8080}

# ======================================
# OPENAI
# ======================================

openai.api.key=${OPENAI_API_KEY:}

# ======================================
# SUPABASE / SOCIAL AUTH
# ======================================

aif.supabase.url=${SUPABASE_URL:}
aif.supabase.anon-key=${SUPABASE_ANON_KEY:}
aif.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
aif.supabase.storage.bucket=${AIF_SUPABASE_STORAGE_BUCKET:}
aif.supabase.storage.prefix=${AIF_SUPABASE_STORAGE_PREFIX:generated-frameworks/}
aif.admin.emails=${AIF_ADMIN_EMAILS:}

# ======================================
# POSTGRESQL
# ======================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aif_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chirantanchatterjee}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ======================================
# JPA
# ======================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ======================================
# FLYWAY
# ======================================

spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# ======================================
# JACKSON
# ======================================

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# ======================================
# AIF WORKSPACE
# ======================================

aif.workspace.root=workspace
aif.generated-tests.timeout-minutes=${AIF_GENERATED_TEST_TIMEOUT_MINUTES:6}
aif.generated-tests.execution-mode=${AIF_GENERATED_TEST_EXECUTION_MODE:inline}
aif.worker.enabled=${AIF_WORKER_ENABLED:false}
aif.worker.poll-delay-ms=${AIF_WORKER_POLL_DELAY_MS:5000}

# ======================================
# LOGGING
# ======================================

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.axiomai=DEBUG

#========================================
# REPORTS
#========================================
aif.public-base-url=${AIF_PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
spring.web.resources.static-locations=file:reports/
